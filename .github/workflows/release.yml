# Build FolioPress for Windows and Linux and publish a GitHub Release.
# Trigger: push a tag matching APP_VERSION, e.g.  git tag v1.0.0 && git push origin v1.0.0
# Or run it by hand from the Actions tab (builds only, no release).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' foliopress.py)
          tag="${GITHUB_REF_NAME#v}"
          [ "$app" = "$tag" ] || { echo "::error::Tag v$tag but APP_VERSION is $app"; exit 1; }

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build zip + installer
        run: python packaging/build.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: foliopress-windows
          path: release/*
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    container: ubuntu:22.04                  # glibc 2.35 → runs on Ubuntu 22.04+, Debian 12+, Fedora 36+
    steps:
      - uses: actions/checkout@v4
      - name: Build tar.gz
        run: sh packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: foliopress-linux
          path: release/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: links.json
          sparse-checkout-cone-mode: false

      - name: Read links.json
        id: links
        run: echo "support=$(jq -r '.support // ""' links.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Download

            | System | File |
            |---|---|
            | **Windows** (installer) | `FolioPress-…-windows-x64-setup.exe` |
            | Windows (portable) | `FolioPress-…-windows-x64.zip` — unzip and run `FolioPress.exe` |
            | **Linux** | `FolioPress-…-linux-x64.tar.gz` — unpack, then run `./install-linux.sh` (or just `./FolioPress`) |

            Windows may show a SmartScreen warning because the app isn't code-signed yet: click **More info → Run anyway**.

            ♥ FolioPress is free. If it helps you, you can [support its development](${{ steps.links.outputs.support }}).
